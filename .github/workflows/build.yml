name: Build release APKs

# v1.6.0 (user request #6): build the x86_64 / arm64 / arm32 (and x86) release
# versions automatically. The project keystore (keystore/wam-release.jks) ships
# with the repo, so the APKs come out signed without extra secrets.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build signed release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ABI splits in app/build.gradle.kts produce one APK per CPU plus universal:
      #   app-armeabi-v7a-release.apk  (arm32)
      #   app-arm64-v8a-release.apk    (arm64)
      #   app-x86-release.apk          (x86)
      #   app-x86_64-release.apk       (x86_64)
      #   app-universal-release.apk    (every device)
      - name: Build release APKs (arm32, arm64, x86, x86_64)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: wam-release-apks
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk

      - name: Attach APKs to a GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true

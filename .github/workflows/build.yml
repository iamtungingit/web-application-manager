name: Build release APKs

# v1.7.0 (user: "better workflow"): builds the x86_64 / x86 / arm64 / arm32 (and
# universal) release APKs automatically. Improvements over v1.6.0:
#   - runs unit tests BEFORE packaging (fail fast)
#   - names every APK WebApplicationManager-<version>-<abi>.apk (version read
#     from app/build.gradle.kts, no duplicate place to maintain)
#   - produces a SHA-256 checksums file and a build summary
#   - concurrency: a new tag push cancels the stale build of the same ref
#   - explicit permissions + timeout (least privilege, no hung jobs)
# The project keystore (keystore/wam-release.jks) ships with the repo, so the
# APKs come out signed without extra secrets.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build signed release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (caches dependencies between runs)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Read app version
        id: version
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building WAM v$V"

      # ABI splits in app/build.gradle.kts produce one APK per CPU plus universal:
      #   app-armeabi-v7a-release.apk  (arm32)
      #   app-arm64-v8a-release.apk    (arm64)
      #   app-x86-release.apk          (x86)
      #   app-x86_64-release.apk       (x86_64)
      #   app-universal-release.apk    (every device)
      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest --no-daemon --stacktrace

      - name: Build release APKs (arm32, arm64, x86, x86_64, universal)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APKs with version + checksums
        run: |
          V="${{ steps.version.outputs.version }}"
          cd app/build/outputs/apk/release
          mkdir -p out
          cp app-armeabi-v7a-release.apk "out/WebApplicationManager-$V-arm32-release.apk"
          cp app-arm64-v8a-release.apk   "out/WebApplicationManager-$V-arm64-release.apk"
          cp app-x86-release.apk         "out/WebApplicationManager-$V-x86-release.apk"
          cp app-x86_64-release.apk      "out/WebApplicationManager-$V-x86_64-release.apk"
          cp app-universal-release.apk   "out/WebApplicationManager-$V-universal-release.apk"
          cd out
          sha256sum *.apk > WebApplicationManager-$V-checksums.txt
          {
            echo "### WAM v$V artifacts"
            ls -la *.apk
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: wam-${{ steps.version.outputs.version }}-apks
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/out/*

      - name: Attach APKs to a GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/out/*
          generate_release_notes: true
